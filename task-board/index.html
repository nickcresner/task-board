<!DOCTYPE html>
<html lang="en">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <meta charset="utf-8"/>
    <meta name="theme-color" content="#ff6b00"/>
    <meta name="apple-mobile-web-app-capable" content="yes"/>
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
    <link rel="manifest" href="/manifest.json"/>
    <title>Nick & Henry - Task Board</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #0a0a0a; color: #ffffff; padding: 16px; }
        .board { max-width: 400px; margin: 0 auto; }
        .header { font-size: 20px; font-weight: bold; margin-bottom: 20px; text-align: center; color: #ff6b00; }
        
        .task-list { display: flex; flex-direction: column; gap: 8px; }
        .task-card {
            background: #1a1a1a;
            border: 1px solid #262626;
            border-radius: 12px;
            padding: 16px;
            transition: all 0.3s ease;
        }
        .task-card:hover { border-color: #404040; transform: translateY(-1px); }
        .task-title { font-weight: 600; font-size: 14px; line-height: 1.3; margin-bottom: 8px; }
        .task-meta { display: flex; justify-content: space-between; align-items: center; font-size: 12px; color: #888; }
        .status { padding: 4px 8px; border-radius: 20px; font-size: 11px; font-weight: bold; }
        .status.active { background: #007acc; }
        .status.done { background: #28a745; }
        .status.backlog { background: #6f42c1; }
        
        .assignee { color: #ff6b00; }
        
        .refresh-btn {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: #ff6b00;
            color: #0a0a0a;
            border: none;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            font-size: 24px;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(255, 107, 0, 0.3);
        }
        
        @media (max-width: 480px) {
            .task-card { padding: 12px; }
            .task-title { font-size: 13px; }
        }
    </style>
</head>
<body>
    <div class="board">
        <div class="header">Nick & Henry Board</div>
        
        <div class="task-list">
            <!-- Active Tasks -->
            <div class="task-card">
                <div class="task-title">Build Reddit Hourly Intel Skill</div>
                <div class="task-meta">
                    <span class="assignee">Henry</span>
                    <span class="status done">Done</span>
                </div>
            </div>
            
            <div class="task-card">
                <div class="task-title">Deploy Task Board to Mobile</div>
                <div class="task-meta">
                    <span class="assignee">Henry</span>
                    <span class="status done">Done</span>
                </div>
            </div>
            
            <!-- Backlog -->
            <div class="task-card">
                <div class="task-title">Memory Viewer installed</div>
                <div class="task-meta">
                    <span class="assignee">Henry</span>
                    <span class="status done">Done</span>
                </div>
            </div>
            
            <div class="task-card">
                <div class="task-title">Gmail Integration Setup</div>
                <div class="task-meta">
                    <span class="assignee">Henry</span>
                    <span class="status backlog">Backlog</span>
                </div>
            </div>
        </div>
    </div>
    
    <button class="refresh-btn" onclick="location.reload()">↻</button>
    
    <script>
        // Auto-refresh every 15 minutes
        setInterval(() => location.reload(), 15 * 60 * 1000);
        
        // Register Service Worker for PWA
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('/sw.js')
                .then(reg => console.log('SW registered'))
                .catch(err => console.log('SW registration failed'));
        }
    </script>
</body>
</html>
